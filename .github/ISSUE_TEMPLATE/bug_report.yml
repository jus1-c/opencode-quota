name: Bug report
description: Report a reproducible bug in opencode-quota
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Using OpenCode 1? The older version of this plugin only gets small fixes now.

  - type: dropdown
    id: opencode_line
    attributes:
      label: Which OpenCode do you use?
      options:
        - OpenCode 2
        - OpenCode 1
    validations:
      required: true

  - type: input
    id: opencode_version
    attributes:
      label: Your OpenCode version
      description: Example `2.0.20`
      placeholder: 2.0.20
    validations:
      required: true

  - type: input
    id: plugin_version
    attributes:
      label: Your plugin version
      description: Run `/quota_status` in OpenCode. The version is in the first line. If it has `beta` in it, update first, because it may already be fixed.
      placeholder: 5.0.1
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What went wrong?
      description: What did you expect, and what happened instead? Screenshots help. Drag them into this box.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How can we make it happen?
      description: List the steps. Include any commands you typed and your settings.
      placeholder: |
        1. I set up ...
        2. I typed ...
        3. I saw ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Paste what `/quota_status` shows (optional)
      description: It never shows your keys or passwords. It does show folder paths, which can include your computer's username.
      render: shell
